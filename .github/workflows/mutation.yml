name: Mutation

# The ratchet on what is already clean.
#
# `stryker.conf.json`'s `mutate` list is the scope that has been paid down
# to 100%, and its `break: 100` fails this job the moment a change stops a
# mutant being killed. Today that is everything the app ships: `src/lib`,
# every module under `src/modules`, `src/ui/**/*.tsx` and
# `src/modules/**/*.tsx`. What is outside it is `src/routes/` and the
# `functions.ts` files, and `test/architecture/server-functions-are-glue`
# is what keeps those exclusions honest.
#
# This is NOT the same enforcement as the guardrails commit-gate analyzer
# (`"stryker": "required"` in guardrails.config.json). That one scopes to
# the *changed production* files, which leaves one hole this workflow is
# the only cover for: **weakening a test changes no production file**, so
# the local gate mutates nothing and the push sails through. Only a
# whole-scope run catches an assertion someone deleted.
#
# Which is why the `Mutation` job at the bottom exists and belongs in the
# branch-protection required set. It aggregates the shards into one
# context, so the required list does not have to be edited every time a
# scope joins the ratchet — and it reports success when the matrix was
# skipped, so a docs-only PR is not blocked forever waiting on a check
# that never runs. That is the trap a `paths:` filter sets on a required
# workflow, and it is why the filtering happens in a job here instead.
#
# ── Why this runs on `main` as well as on PRs ──────────────────────────
#
# Two different runs, deliberately:
#
#   pull_request  incremental, seeded from main's report. Fast, and what
#                 you wait on.
#   push to main  incremental report written from cold. Slow, nobody waits.
#
# The PR run reuses stryker's incremental report, which re-tests mutants in
# changed files and mutants whose covering tests changed, and trusts the
# stored result for everything else. That trust has one real gap: a change
# in file A can alter whether a mutant in *unchanged* file B is killed, and
# nothing invalidates B. So the run on `main` is the honest measurement —
# cold, no restore, every mutant actually executed — and it is what the
# PR runs are calibrated against. If it goes red, fix forward; `main` is
# protected and the PR gate has already caught everything cheaper.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes the run on its old head, so that run is
# cancelled. A run on `main` is not, because it writes the report every PR
# is seeded from. Each shard uploads its own report when it finishes, so a
# cancelled `main` run would still leave the fast shards' reports. The slow ones
# (`modules/safety` and `lib/contracts/email`, about 3 hours cold) were
# cancelled by the next merge on every run, so they never stored a report.
# After any dependency change to the cache key, every PR then ran those two
# cold, for 2 to 3 hours. Measured 2026-11-01: the last 11 `main` runs were
# cancelled, and no `main` cache existed for either shard under the
# current key. Without cancellation, GitHub keeps one run going and at most
# one newer run pending.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The scopes are read from stryker.conf.json rather than restated here.
  # A hand-kept copy of the list is a rival truth: the local `npm run
  # mutate` and CI would drift, and the drift would show up as CI passing
  # on a module nobody was actually mutating.
  scopes:
    name: Read the ratcheted scopes
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
      relevant: ${{ steps.read.outputs.relevant }}
      deps: ${{ steps.deps.outputs.digest }}
    steps:
      # Audit first (design 196): reports the hosts this job reaches and
      # blocks none. It moves to `block` once that list is known and short.
      - uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # The fetch below is of a public repository and needs no token.
          persist-credentials: false

      # The shard selector cruises the import graph with dependency-cruiser
      # and runs under tsx, so this job installs what the shards do.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The cache key hashed the whole lockfile, which meant a prettier or
      # tailwind bump threw away every shard's stored verdicts and cost a
      # full cold cycle — 32 minutes — to re-learn what it already knew.
      # Two of three cold runs on 2026-09-10 were exactly that.
      #
      # What can actually change whether a mutant is killed: anything the
      # code imports at runtime, and the stack that runs the tests. What
      # cannot: the linters, the formatter, the clone detector, the build
      # tooling. So the digest covers every runtime dependency plus an
      # explicit allowlist of the test stack, and nothing else.
      #
      # Deliberately conservative on `dependencies`: a zod or drizzle bump
      # genuinely can flip a verdict, so all of them count. The saving is
      # from devDependencies, which is where the churn is.
      - id: deps
        run: |
          echo "digest=$(node -p '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const RUNS_THE_TESTS = /^(@stryker-mutator\/|vitest$|@vitest\/|@cloudflare\/vitest-pool-workers$|@testing-library\/|happy-dom$|jsdom$)/;
            const names = [
              ...Object.keys(pkg.dependencies ?? {}),
              ...Object.keys(pkg.devDependencies ?? {}).filter((name) => RUNS_THE_TESTS.test(name)),
            ].sort();
            const pinned = names
              .map((name) => `${name}@${lock.packages?.[`node_modules/${name}`]?.version ?? "missing"}`)
              .join(",");
            require("node:crypto").createHash("sha256").update(pinned).digest("hex").slice(0, 16);
          ')" >> "$GITHUB_OUTPUT"

      # One shard per entry of stryker.conf.json's `mutate` array, and on a
      # PR only the shards its diff can affect (design 259). Mutation is
      # most of a PR's runner time, and most of that was shards with
      # nothing to re-test.
      #
      # scripts/mutation-shards.ts prints the matrix. Each shard gets a
      # short, stable name, and the job name uses that rather than the
      # glob, which runs to ~900 characters and — since a required context
      # is matched by exact string — would change every time a route is
      # added or removed. `slug` is the name made safe for an artifact.
      # Both are derived there, not restated here.
      #
      # On a PR it keeps a shard when a changed file is in its scope, a
      # file in its scope imports a changed file, or a changed test reaches
      # a file in its scope; it keeps every shard when the diff touches the
      # toolchain or the test harness, or when the import graph cannot
      # answer. An empty list skips `mutate`, and the `Mutation` job passes
      # as it does for a docs-only PR. This used to be a `paths:` filter on
      # the trigger, which cannot work once the job is required: a workflow
      # that does not run reports no context, and a required context that
      # never arrives blocks the merge indefinitely. If the selector itself
      # fails, every shard runs.
      #
      # A push to `main` runs every shard — that run exists to refresh the
      # cold measurement every PR is seeded from, not to react to a diff,
      # and it is what catches a survivor a skipped shard would have hidden.
      #
      # The base is the PR's own (`pull_request.base.ref`), not
      # `github.base_ref`: in a GitHub stack, `base_ref` names the branch
      # the whole stack targets, so a docs-only PR high in a stack diffed
      # against `main` and mutated everything below it (#334, 2026-11-05).
      # Outside a stack the two are the same. A branch name is text the
      # PR's author chose, so it reaches the script through `env`.
      - name: Choose the shards
        id: read
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            list=$(npx tsx scripts/mutation-shards.ts)
          else
            git fetch --no-tags origin \
              "+refs/heads/$BASE:refs/remotes/origin/$BASE"
            changes="$RUNNER_TEMP/changes.txt"
            git diff --name-status --no-renames "origin/$BASE...HEAD" >"$changes"
            if ! list=$(npx tsx scripts/mutation-shards.ts "$changes"); then
              echo "::warning::could not choose the shards from the diff; running every shard"
              list=$(npx tsx scripts/mutation-shards.ts)
            fi
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          if [ "$list" = "[]" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  mutate:
    name: "Mutation score: ${{ matrix.name }}"
    needs: scopes
    if: needs.scopes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # A cap per shard, so a stuck one fails instead of holding a runner for
    # GitHub's default six hours (#876). Cold runs on main, 2026-11: every
    # shard finished within 231 min except `lib/copy (ts)`, which ran 145-358
    # and was killed twice at 360. Its static mutants (module-scope code, so
    # each runs the whole suite) were split across three entries in
    # stryker.conf.json in the same change. A shard that hits the cap reports
    # cancelled, the `Mutation` job counts that as a failure, and on main
    # `main-status` below opens the alert.
    timeout-minutes: 240
    permissions:
      contents: read
      # To find main's runs and download a shard's report from one.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scopes.outputs.list) }}
    steps:
      # Audit first (design 196): reports the hosts this job reaches and
      # blocks none. It moves to `block` once that list is known and short.
      - uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stryker runs vitest, and vitest runs all three projects —
      # including `browser`, which is where eight of blur/detect.ts's
      # mutants are killed. A shard without a browser cannot kill them and
      # would fail on `break: 100` for a reason that has nothing to do
      # with the diff. Installed for every shard rather than only the
      # safety one, because the matrix is derived from stryker.conf.json
      # and a condition naming a scope here would be the hand-kept copy
      # that file exists to avoid.
      - name: Install the browser the vitest browser project drives
        run: npx playwright install --with-deps chromium

      # MediaPipe's WASM is gitignored and staged out of node_modules, and
      # the `browser` vitest project fetches it over HTTP. `npm test` stages
      # it through `pretest`; anything that reaches vitest by another road —
      # stryker here, the dev server for e2e — has to ask for it, or the
      # model 404s and every browser test fails as "unavailable".
      - run: npm run stage:mediapipe

      # Seed on PRs only. The run on `main` is deliberately cold: it is
      # the measurement everything else is calibrated against, and a warm
      # one would inherit whatever the last warm one assumed.
      #
      # The seed is this shard's report from the newest completed run on
      # `main` whose dependency digest (`scopes` above, recorded beside the
      # report) is this run's: a stryker or vitest bump invalidates every
      # stored result. The shard may have passed or failed there. Its
      # Survived and NoCoverage results are dropped before stryker reads
      # it, so they are tested again (stryker reuses a cached survivor of
      # module-level code even after a killing test lands, stryker-js#6119)
      # and only kills carry over, as the local gate's seed does.
      # It is read from main's push runs only, never from a PR's own runs,
      # so every push to a PR starts from main's report and re-tests what
      # the PR changed. A run counts only when its commit is in main's
      # history, fetched here (commits only) and named by its full ref;
      # scripts/main-mutation-runs.sh is the same list the local seed
      # reads. With no such run in reach, this shard runs cold.
      # Every value reaches the script through `env`.
      - name: Seed from main's report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHARD: "Mutation score: ${{ matrix.name }}"
          SLUG: ${{ matrix.slug }}
          DEPS: ${{ needs.scopes.outputs.deps }}
        run: |
          set -euo pipefail
          seed="$RUNNER_TEMP/seed"
          if ! git fetch --quiet --no-tags --filter=tree:0 origin +refs/heads/main:refs/remotes/origin/main; then
            echo "::notice::could not fetch main's history; running cold"
            exit 0
          fi
          # An API error anywhere here runs the shard cold; it never fails it.
          if ! runs=$(sh scripts/main-mutation-runs.sh refs/remotes/origin/main 20); then
            echo "::notice::could not list main's runs; running cold"
            exit 0
          fi
          for run in $runs; do
            rm -rf "$seed"
            gh run download "$run" --name "stryker-incremental-$SLUG" --dir "$seed" 2>/dev/null || continue
            [ "$(cat "$seed/stryker-deps.txt" 2>/dev/null)" = "$DEPS" ] || continue
            [ -f "$seed/stryker-incremental.json" ] && [ ! -L "$seed/stryker-incremental.json" ] || continue
            mkdir -p reports
            jq '.files |= map_values(.mutants |= map(select(.status != "Survived" and .status != "NoCoverage")))' \
              "$seed/stryker-incremental.json" >reports/stryker-incremental.json || continue
            echo "::notice::seeded from main's run $run"
            exit 0
          done
          echo "::notice::no passing main run with this dependency digest has a report for this shard; running cold"

      # Sharded by scope because this is minutes, not seconds, and the
      # whole ratcheted set only gets bigger. `--mutate` narrows what is
      # mutated; the reported score — and so the `break: 100` threshold —
      # covers exactly this scope.
      #
      # `--incremental` is safe here in a way it is not on the commit gate,
      # and the difference is worth knowing: the gate's `--mutate` is a
      # *different set of changed files every run*, so a report left from
      # another run would fold in results for files outside this scope.
      # A shard's `--mutate` is one fixed glob from the ratchet, so the
      # stored report and the run always describe the same set.
      #
      # The glob reaches the script through `env`: it is text from
      # stryker.conf.json, which a PR can edit, and an expression expanded
      # inside a script is run as script.
      - run: npx stryker run --incremental --mutate "$MUTATE"
        env:
          MUTATE: ${{ matrix.mutate }}

      # Local seeding (guardrails-core 0.14.0, #543). A fresh worktree's
      # gate fetches these through scripts/fetch-mutation-seed.sh
      # (guardrails.config.json `mutationCache.seedFrom`) instead of running
      # cold. Main pushes only: that is the base every branch's gate diffs
      # against. The sidecar pins stryker's version, its config and the
      # lockfile, so a seed from a different setup is discarded locally.
      # An artifact, not actions/cache: a laptop cannot read the cache.
      # One artifact per shard; the scopes are disjoint, which the local
      # merge requires.
      #
      # Uploaded whether the shard passed or failed (owner, 2026-11-13).
      # A red shard's report is still a cold, honest measurement: its
      # survivors stay Survived, so a branch that changes that file still
      # sees them, and its kills hold. A PR's seed above keeps only the
      # kills. A local gate mutates only the branch's changed files,
      # where a kept survivor is a real one. When this was success-only,
      # one red shard on `main` left every lane's push gate running that
      # scope cold until `main` went green (#660: closet and safety tsx,
      # wave 8). The report has to exist: a dry-run crash writes none.
      - name: Fingerprint the report for local seeding
        if: "!cancelled() && github.event_name == 'push' && hashFiles('reports/stryker-incremental.json') != ''"
        run: node ./node_modules/guardrails-core/dist/cli.mjs mutation-fingerprint

      # The dependency digest the report was measured under, for a PR's
      # seed above. Not `.json`, so the local seed reader passes over it.
      - name: Record the dependency digest
        if: "!cancelled() && github.event_name == 'push' && hashFiles('reports/stryker-incremental.json') != ''"
        env:
          DEPS: ${{ needs.scopes.outputs.deps }}
        run: printf '%s\n' "$DEPS" >reports/stryker-deps.txt

      # Seven days, so a PR opened after a quiet spell on main still finds
      # a seed (owner, 2026-11-22).
      - name: Upload the report for seeding
        if: "!cancelled() && github.event_name == 'push' && hashFiles('reports/stryker-incremental.json') != ''"
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stryker-incremental-${{ matrix.slug }}
          path: |
            reports/stryker-incremental.json
            reports/stryker-incremental.fingerprint.json
            reports/stryker-deps.txt
          retention-days: 7
          if-no-files-found: error

  # The one context branch protection requires. Scopes come and go from
  # the ratchet; this does not.
  gate:
    name: Mutation
    needs: [scopes, mutate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the Dependabot step below: the PR's auto-merge state and the
      # Dependabot run for its head.
      pull-requests: read
      actions: read
    steps:
      # Audit first (design 196): reports the hosts this job reaches and
      # blocks none. It moves to `block` once that list is known and short.
      - uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Check the shards
        env:
          scopes: ${{ needs.scopes.result }}
          shards: ${{ needs.mutate.result }}
        run: |
          echo "scopes: $scopes · shards: $shards"
          # `skipped` is the honest pass: this PR changed nothing any
          # shard's result depends on. Anything other than success or skipped —
          # including a cancelled shard — is not a pass.
          if [ "$scopes" != "success" ]; then
            echo "::error::Could not read the ratcheted scopes."
            exit 1
          fi
          if [ "$shards" != "success" ] && [ "$shards" != "skipped" ]; then
            echo "::error::A mutation scope did not reach 100. See the shard that failed."
            exit 1
          fi

      # A Dependabot PR that is set to merge itself passes this required
      # check only when the newest dependabot-pr.yml run for its head has
      # answered yes: classify finished and disarm was skipped (or classify
      # was skipped, as for the open-source-list commit). A disarm that
      # ran, failed or is still to run, or no run at all, fails it, so the
      # PR waits for a person. This job runs long after classify, checks
      # nothing out and runs no package code. Every other PR passes the
      # step. Values reach the script through `env`.
      - name: Check a self-merging Dependabot PR was cleared for its head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '"\(.user.login) \(.auto_merge != null)"')
          if [ "$state" != "dependabot[bot] true" ]; then
            echo "Not a Dependabot PR set to merge itself."
            exit 0
          fi
          run=$(gh api "repos/$REPO/actions/workflows/dependabot-pr.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "::error::This Dependabot PR is set to merge itself, and no Dependabot run has answered for its head."
            exit 1
          fi
          jobs=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | {name, status, conclusion}]')
          classify=$(jq -r 'map(select(.name == "classify")) | first // {} | "\(.status) \(.conclusion)"' <<<"$jobs")
          disarm=$(jq -r 'map(select(.name == "disarm")) | first // {} | .conclusion // "absent"' <<<"$jobs")
          if [ "$classify" = "completed skipped" ] || { [ "${classify%% *}" = completed ] && [ "$disarm" = skipped ]; }; then
            echo "Cleared for its head by run $run."
            exit 0
          fi
          echo "::error::This Dependabot PR is set to merge itself, but run $run has not cleared its head (classify: $classify, disarm: $disarm). It waits for a person."
          exit 1

  # Main's result where a coordinator will see it (#876, resilience law 6).
  # Nothing told anyone when main went red: a survivor that reached main
  # turned three PRs red before anyone noticed. On red this opens (or
  # comments on) the "Mutation is red on main" issue; on green it closes it.
  # scripts/mutation-main-alert.sh does the work and is re-runnable.
  # Pushes to main only, and only for a run that finished: a cancelled run
  # was replaced by a newer one, which reports instead.
  main-status:
    name: Report main's Mutation result
    needs: [gate]
    if: always() && github.event_name == 'push' && (needs.gate.result == 'success' || needs.gate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # Audit first (design 196): reports the hosts this job reaches and
      # blocks none. It moves to `block` once that list is known and short.
      - uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: sh scripts/mutation-main-alert.sh "$RUN_ID" "$RESULT" "$COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.gate.result }}
          COMMIT: ${{ github.sha }}
