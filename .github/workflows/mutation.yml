name: Mutation

# The ratchet on what is already clean.
#
# `stryker.conf.json`'s `mutate` list is the scope that has been paid down
# to 100%, and its `break: 100` fails this job the moment a change stops a
# mutant being killed. Today that is everything the app ships: `src/lib`,
# every module under `src/modules`, `src/ui/**/*.tsx` and
# `src/modules/**/*.tsx`. What is outside it is `src/routes/` and the
# `functions.ts` files, and `test/architecture/server-functions-are-glue`
# is what keeps those exclusions honest.
#
# This is NOT the same enforcement as the guardrails commit-gate analyzer
# (`"stryker": "required"` in guardrails.config.json). That one scopes to
# the *changed production* files, which leaves one hole this workflow is
# the only cover for: **weakening a test changes no production file**, so
# the local gate mutates nothing and the push sails through. Only a
# whole-scope run catches an assertion someone deleted.
#
# Which is why the `Mutation` job at the bottom exists and belongs in the
# branch-protection required set. It aggregates the shards into one
# context, so the required list does not have to be edited every time a
# scope joins the ratchet — and it reports success when the matrix was
# skipped, so a docs-only PR is not blocked forever waiting on a check
# that never runs. That is the trap a `paths:` filter sets on a required
# workflow, and it is why the filtering happens in a job here instead.
#
# ── Why this runs on `main` as well as on PRs ──────────────────────────
#
# Two different runs, deliberately:
#
#   pull_request  incremental, warm from cache. Fast, and what you wait on.
#   push to main  incremental report written from cold. Slow, nobody waits.
#
# The PR run reuses stryker's incremental report, which re-tests mutants in
# changed files and mutants whose covering tests changed, and trusts the
# stored result for everything else. That trust has one real gap: a change
# in file A can alter whether a mutant in *unchanged* file B is killed, and
# nothing invalidates B. So the run on `main` is the honest measurement —
# cold, no restore, every mutant actually executed — and it is what the
# PR runs are calibrated against. If it goes red, fix forward; `main` is
# protected and the PR gate has already caught everything cheaper.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The scopes are read from stryker.conf.json rather than restated here.
  # A hand-kept copy of the list is a rival truth: the local `npm run
  # mutate` and CI would drift, and the drift would show up as CI passing
  # on a module nobody was actually mutating.
  scopes:
    name: Read the ratcheted scopes
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
      relevant: ${{ steps.changed.outputs.relevant }}
      deps: ${{ steps.deps.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Each scope gets a short, stable name, and the job name uses that
      # rather than the glob. The glob is not a name: the components scope
      # carries 24 route negations and runs to ~900 characters, which is
      # unreadable in the checks list and — since a required context is
      # matched by exact string — would change every time a route is added
      # or removed. `slug` is the same name made safe for a cache key.
      # Both are derived, not restated, so they cannot drift from the
      # scope they label.
      - id: read
        run: |
          echo "list=$(node -p '
            const scopes = require("./stryker.conf.json").mutate;
            const nameOf = (scope) => {
              const positive = scope.split(",")[0];
              const extension = positive.slice(positive.lastIndexOf(".") + 1);
              const [head] = positive.split("/**");
              const base = head === positive ? head.replace(/\.[^./]+$/, "") : head;
              return `${base.replace(/^src\//, "")} (${extension})`;
            };
            const slugOf = (name) => name.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
            JSON.stringify(scopes.map((mutate) => {
              const name = nameOf(mutate);
              return { mutate, name, slug: slugOf(name) };
            }));
          ')" >> "$GITHUB_OUTPUT"

      # The cache key hashed the whole lockfile, which meant a prettier or
      # tailwind bump threw away every shard's stored verdicts and cost a
      # full cold cycle — 32 minutes — to re-learn what it already knew.
      # Two of three cold runs on 2026-09-10 were exactly that.
      #
      # What can actually change whether a mutant is killed: anything the
      # code imports at runtime, and the stack that runs the tests. What
      # cannot: the linters, the formatter, the clone detector, the build
      # tooling. So the digest covers every runtime dependency plus an
      # explicit allowlist of the test stack, and nothing else.
      #
      # Deliberately conservative on `dependencies`: a zod or drizzle bump
      # genuinely can flip a verdict, so all of them count. The saving is
      # from devDependencies, which is where the churn is.
      - id: deps
        run: |
          echo "digest=$(node -p '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const RUNS_THE_TESTS = /^(@stryker-mutator\/|vitest$|@vitest\/|@cloudflare\/vitest-pool-workers$|@testing-library\/|happy-dom$|jsdom$)/;
            const names = [
              ...Object.keys(pkg.dependencies ?? {}),
              ...Object.keys(pkg.devDependencies ?? {}).filter((name) => RUNS_THE_TESTS.test(name)),
            ].sort();
            const pinned = names
              .map((name) => `${name}@${lock.packages?.[`node_modules/${name}`]?.version ?? "missing"}`)
              .join(",");
            require("node:crypto").createHash("sha256").update(pinned).digest("hex").slice(0, 16);
          ')" >> "$GITHUB_OUTPUT"

      # Mutation is the slowest thing in CI, so a PR that touches nothing
      # it covers should not wait on it. This used to be a `paths:` filter
      # on the trigger, which cannot work once the job is required: a
      # workflow that does not run reports no context, and a required
      # context that never arrives blocks the merge indefinitely.
      #
      # A push to `main` is always relevant — that run exists to refresh
      # the cold measurement, not to react to a diff.
      - id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          # `package*.json` is in the list because a stryker or vitest bump
          # changes what the ratchet measures while touching no source at
          # all — which is exactly the change you would want re-measured.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -qE '^(src/|test/|stryker\.conf\.json|vitest\.config\.ts|package(-lock)?\.json$|\.github/workflows/mutation\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  mutate:
    name: "Mutation score: ${{ matrix.name }}"
    needs: scopes
    if: needs.scopes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scopes.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restore on PRs only. The run on `main` is deliberately cold: it is
      # the measurement everything else is calibrated against, and a warm
      # one would inherit whatever the last warm one assumed.
      #
      # Restore order is this branch first, then `main` — so pushing again
      # to a PR reuses that PR's own report, and a fresh PR starts from the
      # last honest full run rather than from nothing. Keyed on the
      # lockfile because a stryker or vitest bump invalidates every stored
      # result.
      - name: Restore the incremental report
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-v1-${{ matrix.slug }}-${{ needs.scopes.outputs.deps }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-v1-${{ matrix.slug }}-${{ needs.scopes.outputs.deps }}-${{ github.ref }}-
            stryker-v1-${{ matrix.slug }}-${{ needs.scopes.outputs.deps }}-refs/heads/main-

      # Sharded by scope because this is minutes, not seconds, and the
      # whole ratcheted set only gets bigger. `--mutate` narrows what is
      # mutated; the reported score — and so the `break: 100` threshold —
      # covers exactly this scope.
      #
      # `--incremental` is safe here in a way it is not on the commit gate,
      # and the difference is worth knowing: the gate's `--mutate` is a
      # *different set of changed files every run*, so a report left from
      # another run would fold in results for files outside this scope.
      # A shard's `--mutate` is one fixed glob from the ratchet, so the
      # stored report and the run always describe the same set.
      - run: npx stryker run --incremental --mutate "${{ matrix.mutate }}"

      # Only on success: a shard that failed recorded a survived mutant,
      # and storing that would keep the survivor "known" instead of
      # re-running it.
      - name: Store the incremental report
        if: success()
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-v1-${{ matrix.slug }}-${{ needs.scopes.outputs.deps }}-${{ github.ref }}-${{ github.sha }}

  # The one context branch protection requires. Scopes come and go from
  # the ratchet; this does not.
  gate:
    name: Mutation
    needs: [scopes, mutate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the shards
        run: |
          scopes='${{ needs.scopes.result }}'
          shards='${{ needs.mutate.result }}'
          echo "scopes: $scopes · shards: $shards"
          # `skipped` is the honest pass: this PR changed nothing the
          # ratchet covers. Anything other than success or skipped —
          # including a cancelled shard — is not a pass.
          if [ "$scopes" != "success" ]; then
            echo "::error::Could not read the ratcheted scopes."
            exit 1
          fi
          if [ "$shards" != "success" ] && [ "$shards" != "skipped" ]; then
            echo "::error::A mutation scope did not reach 100. See the shard that failed."
            exit 1
          fi
