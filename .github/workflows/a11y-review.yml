name: Transcript review

# Plan 161, step 5 (docs/designs/161-a11y-coverage.md §5). When a PR
# changes what a screen reader says (e2e/transcripts/, step 4's snapshots),
# Claude reads the diff against the accessibility contract and posts one
# advisory comment. Two jobs, as in dependabot-pr.yml:
#
#   review  computes the diff (no model), then Claude reads it with
#           read-only tools behind a fenced network and returns structured
#           output, which a later step with no key screens as data and
#           renders. No write token.
#   post    posts the screened comment. No model. The comment reaches it
#           as a job output, never an artifact.
#
# ADVISORY. A model's verdicts are not deterministic, so nothing here is a
# required check and neither job can fail the PR: both continue on error,
# and the comment says it is advisory.
#
# THE KEY. The repository secret ANTHROPIC_API_KEY (owner, plan 161's
# decisions), capped on the key itself. Without it the review is skipped,
# not failed. `pull_request`, not `pull_request_target`: a fork's PR gets
# no secrets, so it is skipped too, and nothing here runs with this repo's
# secrets on code from outside it.
#
# PINS. Every `uses:` is a full version tag, locked to a commit in
# `actions.lock` (D-182).
on:
  pull_request:
    paths:
      - "e2e/transcripts/**"

permissions: {}

concurrency:
  group: a11y-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      reviewed: ${{ steps.diff.outputs.reviewed }}
      comment: ${{ steps.screen.outputs.comment }}
    steps:
      - uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            downloads.claude.ai:443
            storage.googleapis.com:443

      # SA-L20: harden-runner fails open (its setup exits 0 when the agent
      # is not installed, or reverts itself), so this proves the fence is
      # up before the key reaches any step: two hosts off the list must be
      # unreachable and sudo gone, or the job stops here.
      - name: The fence is up
        run: |
          for url in https://example.com https://www.iana.org; do
            if curl -sS --max-time 5 -o /dev/null "$url"; then
              echo "::error::$url answered: egress is not blocked"; exit 1
            fi
          done
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo is still available"; exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The transcripts' diff against the base, to a file. Skipped when the
      # key is absent or the diff is empty (a rename, say).
      - id: diff
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; the transcript review is skipped"
            echo "reviewed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --unified=6 "$BASE"...HEAD -- e2e/transcripts >"$RUNNER_TEMP/transcripts.diff"
          if [ ! -s "$RUNNER_TEMP/transcripts.diff" ]; then
            echo "reviewed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # A diff past ~200 KB is a regenerated suite, not a change to read.
          head -c 200000 "$RUNNER_TEMP/transcripts.diff" >transcripts.diff
          echo "reviewed=true" >>"$GITHUB_OUTPUT"

      # The two programs the action runs, fetched here and held to a
      # SHA-256, so the action installs neither itself. Same versions and
      # sums as dependabot-pr.yml, which says how a bump moves them.
      - name: Fetch Bun and Claude Code, checked
        id: bin
        if: steps.diff.outputs.reviewed == 'true'
        env:
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
          CLAUDE_CODE_VERSION: 2.1.319
          CLAUDE_CODE_SHA256: dabafec82ca1319fa43d8be36a10fc61b1d11821cb98ad5df04ad95e199b8eed
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/review-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          echo "$BUN_SHA256  $bin/bun.zip" | sha256sum -c
          unzip -q -j "$bin/bun.zip" bun-linux-x64/bun -d "$bin"
          curl -fsSL -o "$bin/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          echo "$CLAUDE_CODE_SHA256  $bin/claude" | sha256sum -c
          chmod +x "$bin/bun" "$bin/claude"
          echo "dir=$bin" >>"$GITHUB_OUTPUT"

      # Again just before the key is handed over: the agent can revert the
      # fence mid-job.
      - name: The fence is still up
        run: |
          for url in https://example.com https://www.iana.org; do
            if curl -sS --max-time 5 -o /dev/null "$url"; then
              echo "::error::$url answered: egress is not blocked"; exit 1
            fi
          done
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo is still available"; exit 1
          fi

      # Read, Grep and Glob over the checkout, nothing else: no Bash, no
      # web, no writes. No granted tool runs a command, and
      # `--setting-sources user` loads only the settings below, so neither
      # the repository's Claude settings nor their hooks are loaded: nothing
      # here inherits this process's environment, where the key is. The
      # Read deny rules keep the Read tool off process state and the
      # runner's own files. The answer leaves as structured output, which
      # the next step screens.
      # `show_full_output` stays off: these logs are public.
      - id: claude
        if: steps.diff.outputs.reviewed == 'true'
        uses: anthropics/claude-code-action@v1.0.276
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ steps.bin.outputs.dir }}/bun
          path_to_claude_code_executable: ${{ steps.bin.outputs.dir }}/claude
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(//proc/**)",
                  "Read(//sys/**)",
                  "Read(//etc/**)",
                  "Read(//home/runner/work/_temp/**)",
                  "Read(//home/runner/.config/**)",
                  "Read(~/.claude/**)",
                  "Read(./.git/**)"
                ]
              }
            }
          # `opus` is Claude Code's alias for its newest Opus; the checked
          # binary above fixes which Claude Code runs.
          claude_args: |
            --setting-sources user
            --model opus
            --max-turns 40
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task"
            --json-schema '{"type":"object","additionalProperties":false,"required":["summary","findings"],"properties":{"summary":{"type":"string","maxLength":1500},"findings":{"type":"array","maxItems":30,"items":{"type":"object","additionalProperties":false,"required":["transcript","said","problem","suggestion"],"properties":{"transcript":{"type":"string","maxLength":300},"said":{"type":"string","maxLength":300},"problem":{"type":"string","maxLength":500},"suggestion":{"type":"string","maxLength":500}}}}}}'
          prompt: |
            This pull request changes what a screen reader announces in the
            dialed.run web app. Read .claude/skills/a11y-judgment/SKILL.md
            and follow its section "Review a PR's transcript diff". The
            diff against the base branch is in ./transcripts.diff.

            Return its findings in this run's output schema: `transcript`
            is the first screen's path, `said` the phrase as heard,
            `problem` starts with the severity and criterion number, then
            the problem and the confidence, and `suggestion` is the fix. If
            nothing in the diff makes it worse, return no findings and say
            so in the summary. Be terse.

      # The review as data, screened here, in a step that holds no key: it
      # is read from the file the action writes for its run, never from
      # the step's output, and must be under 64 KB, the agreed shape,
      # nothing shaped like a credential, and hold no live @-mention (one
      # could summon a bot or page a person). Rendering is ours, the
      # summary escaped like the table cells. Only the finished comment
      # leaves this job, as its output.
      - name: Screen the review
        id: screen
        if: steps.diff.outputs.reviewed == 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/review.json"
          jq -e '[.[] | select(.type == "result")] | last
            | select(.subtype == "success" and (.is_error | not)) | .structured_output' \
            "$EXECUTION_FILE" >"$file" || { echo "::error::the run returned no review"; exit 1; }
          if [ "$(wc -c <"$file")" -gt 65536 ]; then
            echo "::error::the review is over 64 KB"; exit 1
          fi
          jq -e '
            def text($max): type == "string" and length <= $max;
            type == "object"
            and (keys == ["findings", "summary"])
            and (.summary | text(1500))
            and (.findings | type == "array" and length <= 30 and all(.[];
              type == "object"
              and (keys == ["problem", "said", "suggestion", "transcript"])
              and (.transcript | text(300)) and (.said | text(300))
              and (.problem | text(500)) and (.suggestion | text(500))))
          ' "$file" >/dev/null || { echo "::error::the review isn't the agreed shape"; exit 1; }
          body=$(jq -r '
            def cell: gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|") | gsub("`"; "ʼ");
            "\(.summary | cell)\n\n"
            + (if (.findings | length) == 0 then "No findings.\n"
               else "| Transcript | Said | Problem | Suggestion |\n|---|---|---|---|\n"
                 + (.findings | map("| \(.transcript | cell) | \(.said | cell) | \(.problem | cell) | \(.suggestion | cell) |") | join("\n")) + "\n"
               end)
          ' "$file")
          if grep -qE 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|-----BEGIN' <<<"$body"; then
            echo "::error::the review contains something shaped like a credential; not posting it"; exit 1
          fi
          # A zero-width space after every @ keeps the text and drops the mention.
          zwsp=$(printf '\342\200\213')
          body=$(sed -E "s/@([A-Za-z0-9_-])/@$zwsp\1/g" <<<"$body")
          {
            echo "### Screen-reader transcript review"
            echo
            echo "_Advisory. Written by Claude from this PR's transcript diff (plan 161, step 5); a model's reading, not a check. [Run]($RUN_URL)_"
            echo
            printf '%s\n' "$body"
          } >"$RUNNER_TEMP/comment.md"
          delimiter="REVIEW_$(openssl rand -hex 16)"
          if grep -qF "$delimiter" "$RUNNER_TEMP/comment.md"; then
            echo "::error::the review holds the output delimiter"; exit 1
          fi
          {
            echo "comment<<$delimiter"
            cat "$RUNNER_TEMP/comment.md"
            echo "$delimiter"
          } >>"$GITHUB_OUTPUT"

  post:
    needs: review
    if: needs.review.outputs.reviewed == 'true' && needs.review.outputs.comment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      # Audit first (design 196): reports the hosts this job reaches and
      # blocks none. It moves to `block` once that list is known and short.
      - uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      # The review was screened in `review`, which hands over only the
      # finished comment. It arrives through the environment, never into
      # a script.
      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMMENT: ${{ needs.review.outputs.comment }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COMMENT" >"$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/comment.md"
