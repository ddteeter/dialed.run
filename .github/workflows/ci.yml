name: CI

on:
  # Every pull request, not only those targeting main. A stacked PR — one
  # opened against another branch that is itself under review — otherwise
  # got the guardrails workflow and nothing else, so lint, typecheck, tests,
  # the client-bundle build and the browser e2e all went unrun until it was
  # retargeted at merge time. That is exactly backwards: the checks matter
  # most while the change is still being reviewed.
  #
  # `push` stays pinned to main, which is what keeps the deploy job below
  # (`if: github.event_name == 'push'`) unreachable from a branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every package npm installed carries the registry's signature, and
      # those published with provenance have it verified too. A tarball
      # that did not come from the registry as published fails here. The
      # lockfile's own shape is checked by `npm run lint` (lockfile-lint).
      - name: Verify registry signatures
        run: npm audit signatures

      # `npm test` runs three vitest projects and one of them, `browser`,
      # drives a real Chromium through @vitest/browser-playwright — it is
      # the only place blur/detect.ts's MediaPipe model actually loads.
      # Without a browser here that project fails and the unit job goes
      # red; the e2e job below has installed one all along.
      - name: Install the browser the vitest browser project drives
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Wrangler deploy (dry run)
        run: npx wrangler deploy --dry-run

  # Twice: against the dev server, and against the production build, the
  # Worker bundle workerd runs (`E2E_SERVER` in playwright.config.ts). Dev
  # never runs that bundle, so an update to Vite, the Cloudflare plugin,
  # TanStack Start or React that breaks the build's server rendering is
  # invisible to the dev leg, and dependency updates merge themselves on
  # these checks (design 156). The dev leg keeps the name `e2e`, which
  # branch protection requires; `e2e (build)` is required alongside it.
  e2e:
    name: ${{ matrix.server == 'preview' && 'e2e (build)' || 'e2e' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [dev, preview]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # MediaPipe's WASM is gitignored and staged out of node_modules, and
      # the `browser` vitest project fetches it over HTTP. `npm test` stages
      # it through `pretest`; anything that reaches vitest by another road —
      # stryker here, the dev server for e2e — has to ask for it, or the
      # model 404s and every browser test fails as "unavailable".
      - run: npm run stage:mediapipe
      # ADMIN_USER_IDS: the Desk's operator in e2e/desk (register R-72).
      # The TURNSTILE_* pair are Cloudflare's documented always-pass test
      # keys, so sign-up works in CI once the widget is on it (OPS-5).
      # BETTER_AUTH_URL: overrides the production var in wrangler.jsonc so
      # local sign-in keeps working (OPS-4). The STRAVA_* values are fake
      # placeholders so lane 127's webhook demo runs (owner, 2026-09-26);
      # nothing real is ever called with them.
      - run: |
          {
            echo "BETTER_AUTH_SECRET=ci-only-secret"
            echo "UNSUBSCRIBE_SECRET=ci-only-unsubscribe-secret"
            echo "ADMIN_USER_IDS=e2e-desk-operator"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "STRAVA_CLIENT_ID=0"
            echo "STRAVA_CLIENT_SECRET=ci-placeholder-not-a-secret"
            echo "STRAVA_SUBSCRIPTION_ID=1"
          } > .dev.vars
      - run: npx wrangler d1 migrations apply dialed-core --local
      - run: npx wrangler d1 migrations apply dialed-weather --local
      - if: matrix.server == 'preview'
        run: npm run build
      - run: npx playwright test
        env:
          E2E_SERVER: ${{ matrix.server }}

  deploy:
    name: Deploy to workers.dev
    # Both gates, both e2e legs: a merge whose browser journeys fail, on
    # dev or on the build, does not ship.
    needs: [test, e2e]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, which only `main` may
    # use, so no other job and no pull request can read them
    # (docs/deployment.md §7).
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Before the deploy, and core before weather, the order
      # docs/deployment.md §1 gives. `--remote` is required: Wrangler 4
      # applies to the local database by default, and succeeds doing it.
      # Safe to run first because migrations are expand→contract (law 8):
      # the version still serving works against the expanded schema, and
      # if the deploy below fails, nothing needs undoing.
      - name: Apply migrations
        run: |
          npx wrangler d1 migrations apply dialed-core --remote
          npx wrangler d1 migrations apply dialed-weather --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
