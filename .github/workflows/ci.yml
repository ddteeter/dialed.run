name: CI

on:
  # Every pull request, not only those targeting main. A stacked PR — one
  # opened against another branch that is itself under review — otherwise
  # got the guardrails workflow and nothing else, so lint, typecheck, tests,
  # the client-bundle build and the browser e2e all went unrun until it was
  # retargeted at merge time. That is exactly backwards: the checks matter
  # most while the change is still being reviewed.
  #
  # `push` stays pinned to main, which is what keeps the deploy job below
  # (`if: github.event_name == 'push'`) unreachable from a branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Wrangler deploy (dry run)
        run: npx wrangler deploy --dry-run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "BETTER_AUTH_SECRET=ci-only-secret" > .dev.vars
      - run: npx wrangler d1 migrations apply dialed-core --local
      - run: npx wrangler d1 migrations apply dialed-weather --local
      - run: npx playwright test

  deploy:
    name: Deploy to workers.dev
    needs: test
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
