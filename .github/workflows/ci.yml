name: CI

on:
  # Every pull request, not only those targeting main. A stacked PR — one
  # opened against another branch that is itself under review — otherwise
  # got the guardrails workflow and nothing else, so lint, typecheck, tests,
  # the client-bundle build and the browser e2e all went unrun until it was
  # retargeted at merge time. That is exactly backwards: the checks matter
  # most while the change is still being reviewed.
  #
  # `push` stays pinned to main, which is what keeps the deploy job below
  # (`if: github.event_name == 'push'`) unreachable from a branch.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every package npm installed carries the registry's signature, and
      # those published with provenance have it verified too. A tarball
      # that did not come from the registry as published fails here. The
      # lockfile's own shape is checked by `npm run lint` (lockfile-lint).
      - name: Verify registry signatures
        run: npm audit signatures

      # `npm test` runs three vitest projects and one of them, `browser`,
      # drives a real Chromium through @vitest/browser-playwright — it is
      # the only place blur/detect.ts's MediaPipe model actually loads.
      # Without a browser here that project fails and the unit job goes
      # red; the e2e job below has installed one all along.
      - name: Install the browser the vitest browser project drives
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Wrangler deploy (dry run)
        run: npx wrangler deploy --dry-run

  # Twice: against the dev server, and against the production build, the
  # Worker bundle workerd runs (`E2E_SERVER` in playwright.config.ts). Dev
  # never runs that bundle, so an update to Vite, the Cloudflare plugin,
  # TanStack Start or React that breaks the build's server rendering is
  # invisible to the dev leg, and dependency updates merge themselves on
  # these checks (design 156). The dev leg keeps the name `e2e`, which
  # branch protection requires; `e2e (build)` is required alongside it.
  e2e:
    name: ${{ matrix.server == 'preview' && 'e2e (build)' || 'e2e' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [dev, preview]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # MediaPipe's WASM is gitignored and staged out of node_modules, and
      # the `browser` vitest project fetches it over HTTP. `npm test` stages
      # it through `pretest`; anything that reaches vitest by another road —
      # stryker here, the dev server for e2e — has to ask for it, or the
      # model 404s and every browser test fails as "unavailable".
      - run: npm run stage:mediapipe
      # ADMIN_USER_IDS: the Desk's operator in e2e/desk (register R-72).
      # The TURNSTILE_* pair are Cloudflare's documented always-pass test
      # keys, so sign-up works in CI once the widget is on it (OPS-5).
      # BETTER_AUTH_URL: overrides the production var in wrangler.jsonc so
      # local sign-in keeps working (OPS-4). The STRAVA_* values are fake
      # placeholders so lane 127's webhook demo runs (owner, 2026-09-26);
      # nothing real is ever called with them. The GARMIN_* lines make the
      # Garmin demo's owner (e2e/garmin, plan 160); the key is a placeholder
      # the stub accepts (owner, 2026-10-27). GARMIN_API_ORIGIN is not here:
      # Playwright sets it to the stub it starts (e2e/garmin/stub-origin.ts).
      - run: |
          {
            echo "BETTER_AUTH_SECRET=ci-only-secret"
            echo "UNSUBSCRIBE_SECRET=ci-only-unsubscribe-secret"
            echo "ADMIN_USER_IDS=e2e-desk-operator"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "STRAVA_CLIENT_ID=0"
            echo "STRAVA_CLIENT_SECRET=ci-placeholder-not-a-secret"
            echo "STRAVA_SUBSCRIPTION_ID=1"
            echo "GARMIN_API_KEY=ci-placeholder-not-a-key"
            echo "GARMIN_OWNER_USER_ID=e2e-garmin-owner"
            echo 'MODERATION_THRESHOLDS={"reports":{"explicit":2,"intimate":1,"harassment":2,"spam":2,"not_theirs":2,"other":2},"photos":{"sexual":0.8,"violence":0.8,"violence/graphic":0.7,"self-harm":0.7,"self-harm/intent":0.7,"self-harm/instructions":0.7}}'
          } > .dev.vars
      - run: npx wrangler d1 migrations apply dialed-core --local
      - run: npx wrangler d1 migrations apply dialed-weather --local
      - run: npx wrangler d1 migrations apply dialed-ops --local
      - if: matrix.server == 'preview'
        run: npm run build
      - run: npx playwright test
        env:
          E2E_SERVER: ${{ matrix.server }}

  # The workflows themselves: expressions, permissions, and every `run:`
  # through shellcheck. They hold the deploy keys and the automation App,
  # and an unattended merge trusts them, yet nothing else reads them.
  #
  # The release binary at a pinned checksum, not a marketplace action, so
  # the allowed-actions list stays as it is. actionlint skips shellcheck
  # without a word when it is missing, so its absence fails the job.
  # Shellcheck's info level is off: it flags the single-quoted
  # `node -p '…'` programs in mutation.yml, which are quoted that way so
  # the shell leaves their `${…}` alone.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          command -v shellcheck || { echo "::error::shellcheck is not on the runner"; exit 1; }
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar xzf "$tarball" actionlint
      - name: Lint the workflows
        run: ./actionlint -color
        env:
          SHELLCHECK_OPTS: --severity=warning

  deploy:
    name: Deploy to workers.dev
    # Both gates, both e2e legs: a merge whose browser journeys fail, on
    # dev or on the build, does not ship.
    needs: [test, e2e]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, which only `main` may
    # use, so no other job and no pull request can read them
    # (docs/deployment.md §7).
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Before the deploy, in the order (core, weather, ops)
      # docs/deployment.md §1 gives. `--remote` is required: Wrangler 4
      # applies to the local database by default, and succeeds doing it.
      # Safe to run first because migrations are expand→contract (law 8):
      # the version still serving works against the expanded schema, and
      # if the deploy below fails, nothing needs undoing.
      - name: Apply migrations
        run: |
          npx wrangler d1 migrations apply dialed-core --remote
          npx wrangler d1 migrations apply dialed-weather --remote
          npx wrangler d1 migrations apply dialed-ops --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload the new version (serves nothing)
        id: upload
        run: |
          out="$RUNNER_TEMP/wrangler-output.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$out" npx wrangler versions upload \
            --tag "${GITHUB_SHA::12}" --message "main ${GITHUB_SHA::12}"
          id=$(jq -r 'select(.type == "version-upload") | .version_id' "$out")
          test -n "$id"
          echo "new=$id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Note the version serving now
        id: current
        run: |
          id=$(npx wrangler deployments status --json \
            | jq -r '.versions[] | select(.percentage == 100) | .version_id')
          test -n "$id"
          echo "old=$id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy it at 0%, reachable only by the override
        run: >
          npx wrangler versions deploy
          ${{ steps.upload.outputs.new }}@0% ${{ steps.current.outputs.old }}@100%
          --yes --message "smoke ${GITHUB_SHA::12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the new version in production
        id: smoke
        # The override can take "up to a couple of seconds" to propagate.
        run: sleep 10 && npx playwright test --config playwright.smoke.config.ts
        env:
          SMOKE_BASE_URL: https://dialed.run
          SMOKE_VERSION_ID: ${{ steps.upload.outputs.new }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

      - name: Take the failed version out again
        if: failure() && steps.current.outputs.old != ''
        run: >
          npx wrangler versions deploy ${{ steps.current.outputs.old }}@100%
          --yes --message "smoke failed ${GITHUB_SHA::12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Straight to 100% after the smoke test (owner, 2026-11-10). A 10%
      # soak comes back with #505, which gives it a signal to watch: with
      # nothing watching, it only delayed a bad version by ten minutes.
      - name: Shift to 100%
        run: >
          npx wrangler versions deploy ${{ steps.upload.outputs.new }}@100%
          --yes --message "100% ${GITHUB_SHA::12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply cron triggers (versions upload does not)
        run: npx wrangler triggers deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
