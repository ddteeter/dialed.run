name: Open-source list

# On a Dependabot npm PR, rebuilds src/modules/account/open-source-list.json
# and uploads it. The list records the version of every package the bundles
# ship (design 151), and under CI a build that changes it fails: without
# this, every update that moves a shipped package fails CI.
#
# Read-only: this runs the bumped packages' code, so it gets no write token
# and no secrets. "Commit the open-source list" (oss-list-commit.yml) runs
# from main on workflow_run, checks what this uploaded, and commits it to
# the PR. Ported from dialed.run-site; design 156, docs/dependencies.md.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  list:
    # A same-repo Dependabot npm branch only: a fork can't name its way in.
    if: >-
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The PR's head, which is what the list will be committed onto.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # postbuild rewrites the list, then fails under CI because it changed.
      # That failure is what this workflow is for, so it doesn't stop the run.
      - name: Build, which rewrites the list
        run: npm run build
        continue-on-error: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-source-list
          path: src/modules/account/open-source-list.json
          if-no-files-found: error
          retention-days: 1
