name: Commit the open-source list

# Commits the list "Open-source list" (oss-list.yml) rebuilt onto its
# Dependabot npm PR. Ported from dialed.run-site; the security review is in
# docs/dependencies.md. In short:
#
# - workflow_run always runs this file from main, so a PR can't change it.
# - workflow_run gets a write token even when the run it follows had none,
#   so it trusts nothing about that run: the repository, the workflow
#   file, the PR's author, branch and head SHA are all checked.
# - It runs no code from the repo or its packages: no npm, no caches, no
#   scripts or hooks from the checkout. The artifact is untrusted data,
#   checked with jq and written to one path.
# - It pushes without --force onto the SHA the list was built from, so a
#   newer Dependabot push wins. "[dependabot skip]" lets Dependabot keep
#   rebasing over this commit.
# - It pushes as the automation App, not with GITHUB_TOKEN. A GITHUB_TOKEN
#   push starts CI only once someone approves the run, which is the one
#   manual step dialed.run-site still has. The App's key is minted only
#   after every check above has passed.
on:
  workflow_run:
    workflows: ["Open-source list"]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  commit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/oss-list.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dependabot-merge
    permissions:
      actions: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      LIST: src/modules/account/open-source-list.json
    steps:
      - name: Check this is Dependabot's open npm PR, at the SHA that was built
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_BRANCH" =~ ^dependabot/npm_and_yarn/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::unexpected branch name"; exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected head SHA"; exit 1
          fi
          prs=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$OWNER:$HEAD_BRANCH")
          if [ "$(jq length <<<"$prs")" != 1 ]; then
            echo "::error::expected one open PR for the branch"; exit 1
          fi
          author=$(jq -r '.[0].user.login' <<<"$prs")
          head_repo=$(jq -r '.[0].head.repo.full_name' <<<"$prs")
          current=$(jq -r '.[0].head.sha' <<<"$prs")
          if [ "$author" != "dependabot[bot]" ] || [ "$head_repo" != "$REPO" ]; then
            echo "::error::the PR isn't Dependabot's, in this repository"; exit 1
          fi
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The PR has moved on since the list was built; its own run will follow."
            echo "current=false" >>"$GITHUB_OUTPUT"
          else
            echo "current=true" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.pr.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: open-source-list
          path: ${{ runner.temp }}/oss-list
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Untrusted data: one regular file, small, and the list's own shape,
      # with every project link https (the page checks again at build).
      - if: steps.pr.outputs.current == 'true'
        name: Check the artifact
        env:
          DIR: ${{ runner.temp }}/oss-list
        run: |
          set -euo pipefail
          file="$DIR/open-source-list.json"
          if [ "$(find "$DIR" -mindepth 1 | wc -l)" != 1 ] || [ ! -f "$file" ] || [ -L "$file" ]; then
            echo "::error::the artifact must be the list alone"; exit 1
          fi
          if [ "$(stat -c %s "$file")" -gt 1048576 ]; then
            echo "::error::the list is over 1 MB"; exit 1
          fi
          jq -e '
            def piece:
              type == "object"
              and (keys - ["name", "version", "licence", "copyright", "project", "text"] == [])
              and (.name | type == "string" and length > 0)
              and (.licence | type == "string" and length > 0)
              and all(.[]; type == "string")
              and ((.project // "https://") | startswith("https://"));
            type == "object"
            and (keys == ["licences", "packages", "tools", "type"])
            and ([.type, .packages, .tools] | all(type == "array"))
            and ([.type[], .packages[], .tools[]] | all(piece))
            and (.licences | type == "object" and all(.[]; type == "string"))
          ' "$file" >/dev/null

      - if: steps.pr.outputs.current == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - if: steps.pr.outputs.current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.app.outputs.token }}

      # Only git from here: nothing in the checkout is run.
      - if: steps.pr.outputs.current == 'true'
        name: Commit the list to the PR
        env:
          DIR: ${{ runner.temp }}/oss-list
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          cp "$DIR/open-source-list.json" "$LIST"
          if git diff --quiet; then
            echo "The list is already current."; exit 0
          fi
          changed=$(git status --porcelain)
          if [ "$changed" != " M $LIST" ]; then
            echo "::error::only the list may change"; echo "$changed"; exit 1
          fi
          bot="$APP_SLUG[bot]"
          bot_id=$(gh api "users/$bot" --jq .id)
          git -c core.hooksPath=/dev/null \
            -c user.name="$bot" \
            -c user.email="$bot_id+$bot@users.noreply.github.com" \
            commit -q -m "chore(deps): refresh the open-source list for this update" \
            -m "Regenerated by the Open-source list workflow. [dependabot skip]" -- "$LIST"
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$HEAD_BRANCH"
