# Consumer-facing CI template, written into a target repo by `guardrails init`.
# The template floats major tags (@v6), because a SHA pinned into a
# consumer's repository would rot under THEIR Dependabot policy. This repo
# now has that policy (.github/dependabot.yml, design 156) and requires SHA
# pins (a repository setting), so here the tags are pinned to commits like
# every other workflow, and Dependabot keeps them current. Re-running
# `guardrails init` would write the floating tags back: re-pin them.
name: Guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The same group `ci.yml` and `mutation.yml` have carried all along, and the
# only one of the three that was missing it -- which mattered most here,
# because this is the workflow that takes hours rather than minutes.
#
# Without it a push superseded nothing: the run on the old SHA kept going to
# completion on its own runner while its replacement started beside it, and
# only the replacement could ever count, since branch protection evaluates
# checks against the head commit. Measured 2026-09-19 on lane/106: a
# `gate --mode=ci` step still running at 116 minutes, already orphaned by
# anything pushed after it.
#
# Keyed on `github.ref`, matching its siblings: that is `refs/pull/<n>/merge`
# for a pull request, so PRs never cancel each other, and `refs/heads/main`
# for a push. A cancelled run reports `cancelled`, which is not a pass --
# correct, because the SHA it was asked about is no longer the head. The
# `Mutation` gate job already spells that rule out for its own shards.
concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The commit gate diffs against the merge-base, which needs history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # The stryker analyzer runs at the `push`/`ci` rung, and stryker runs
      # vitest — which boots all three projects, `browser` among them. No
      # Chromium, no dry run, and the gate fails for a reason unrelated to
      # the diff it was asked about.
      - run: npx playwright install --with-deps chromium
      # MediaPipe's WASM is gitignored and staged out of node_modules, and
      # the `browser` vitest project fetches it over HTTP. `npm test` stages
      # it through `pretest`; anything that reaches vitest by another road —
      # stryker here, the dev server for e2e — has to ask for it, or the
      # model 404s and every browser test fails as "unavailable".
      - run: npm run stage:mediapipe
      # `gate --mode=ci` runs verify PLUS the diff-auditor PLUS the sanction
      # budget. Bare `verify` runs none of the last two.
      #
      # `--mode=ci`, NOT `--mode=commit`: the commit rung scopes the
      # diff-scoped analyzers to the STAGED files, which keeps local commits
      # fast but is empty in a CI checkout, where nothing is staged. `ci` (and
      # its local twin `push`) scope to the branch diff instead, which is the
      # question CI is actually asking.
      #
      # Invoked by explicit path rather than `npx guardrails-core`. The bin is
      # named after the package, so an npx miss resolves THIS package rather
      # than a stranger's -- but it can still fetch a different VERSION than
      # `npm ci` installed. CI must run exactly what it installed, and only the
      # path form guarantees that.
      - run: node ./node_modules/guardrails-core/dist/cli.mjs gate --mode=ci
      - run: node ./node_modules/guardrails-core/dist/cli.mjs sanctions-check
